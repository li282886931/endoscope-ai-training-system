[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endoscope-ai-training"
version = "0.1.0"
description = "Single-machine endoscope AI-assisted training system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
  "numpy>=1.24",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "onnxruntime>=1.16", "ultralytics>=8"]
desktop = ["PySide6-Essentials>=6.6"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
endoscope-training-api = "endoscope_ai_training.app.cli:run_api"
endoscope-training-ui = "endoscope_ai_training.app.cli:run_ui"
endoscope-training-demo-data = "endoscope_ai_training.app.cli:create_demo_data"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
